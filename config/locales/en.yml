  privacy:
    title: "Privacy Policy"
    last_updated: "Last updated: April 2025"
    controller_heading: "Data Controller"
    controller_text: "Open Tender Watch is an open-source civic transparency project. For data protection queries, contact us via the project's GitHub repository."
    purpose_heading: "Purpose & Scope"
    purpose_text: "This platform processes publicly available procurement data from Portuguese and European public databases (Portal BASE, SNS, TED) to detect corruption risk patterns. Personal data processed is limited to names and tax identifiers (NIFs) of company directors and officers, sourced from the Registo Comercial (publicacoes.mj.pt) — a public register."
    legal_basis_heading: "Legal Basis"
    legal_basis_text_html: "Processing is based on <strong>Article 6(1)(e) GDPR</strong> — task carried out in the public interest (anti-corruption monitoring and journalistic research) and <strong>Article 6(1)(f)</strong> — legitimate interest in public accountability of entities receiving public funds. A Legitimate Interest Assessment (LIA) has been conducted. The Portuguese <em>Lei n.° 58/2019</em> (RGPD implementation) and <em>Lei n.° 26/2016</em> (access to public information) further support this processing."
    data_heading: "Data Processed"
    data_text: "Contract metadata (object, price, dates, procedure type, CPV codes), entity identifiers (NIF/NIPC, names), and director/officer names and roles sourced from public commercial registers. No special categories of data (Art. 9 GDPR) are processed."
    pseudonymisation_heading: "Pseudonymisation"
    pseudonymisation_text: "Director and officer names are pseudonymised by default for public visitors. Only authenticated journalists and auditors with a valid access token can view full personal data. Pseudonymised identifiers are deterministic (same person always maps to the same code) but cannot be reversed without access to the application secret."
    graph_heading: "Graph Visualizations"
    graph_text: "Network graphs are provided for corruption-risk triage, not accusation. Public graph mode shows only entity-to-entity links. Authenticated users may enable anonymized individual nodes sourced from public registers; these remain pseudonymized and must not be used for re-identification attempts."
    rights_heading: "Your Rights"
    rights_text_html: "Under GDPR Articles 15–22, data subjects have the right to access, rectification, erasure, restriction, and objection. To exercise these rights, contact us via the project's GitHub repository. Note that the <strong>right to erasure may be limited</strong> under Article 17(3)(a) (freedom of expression and information) and Article 17(3)(d) (archiving in the public interest). We will respond within 30 days."
    retention_heading: "Retention"
    retention_text: "Personal data is retained for as long as the underlying public register records remain publicly available. Access token usage logs are retained for 12 months."
    contact_heading: "Contact"
    contact_text: "For data protection queries, submit an issue on the project's GitHub repository: github.com/bit-of-a-shambles/open-tender-watch"
