      heading: "Methodology"
      subheading: "How risk scores are determined and what each flag means"
      approach_label: "APPROACH"
      track_a: "TRACK A — RULE-BASED FLAGS"
      track_b: "TRACK B — STATISTICAL FLAGS"
      track_c: "TRACK C — INTEGRITY & COMPLIANCE"
      primary_refs: "PRIMARY REFERENCES"
      approach_p1: "Risk indicators follow the OECD framework for detecting corruption and collusion in public procurement. Each flag is independently scored and assigned a confidence level — the score degrades when key fields (NIF, CPV, price, dates) are missing."
      approach_p2: "The system surfaces cases for audit and journalistic review. It does not produce conclusions. All outputs should be treated as leads, not findings."
      track_b_note: "B5 (Benford's Law) active — entity-level analysis. B1–B4 in development — require minimum 2 years of data volume."
      disclaimer: "Risk scores reflect structural anomalies in procurement data. Missing or inconsistent data is itself a risk signal — it can indicate evasion. Absence of a flag does not mean a contract is clean."
      contracts_affected:
        one: "%{count} contract affected"
        other: "%{count} contracts affected"
      risk_scoring:
        heading: "RISK SCORING ALGORITHM"
        intro: "Flag scores accumulate per contract. Entity and company totals (all contracts procured or won) determine their aggregate risk tier:"
        flag_scores_heading: "INDIVIDUAL FLAG SCORES (active flags)"
        tier_none: "NO RISK"
        tier_low: "LOW RISK"
        tier_medium: "MEDIUM RISK"
        tier_high: "HIGH RISK"
        tier_critical: "CRITICAL RISK"
        range_none: "0 points"
        range_low: "1–34 points"
        range_medium: "35–69 points"
        range_high: "70–109 points"
        range_critical: "≥ 110 points"
        degradation: "Scores are reduced proportionally when mandatory data fields (NIF, CPV, price, dates) are absent or invalid in the contract record."
      flags:
        a1_title: "Repeat direct awards"
        a1_desc: "Same supplier receives ≥2 direct awards in 36 months with cumulative value above the CCP Art. 113 §2 statutory cap"
        a1_detail: "Trigger: ≥2 direct awards to the same supplier within the current 3-year economic window (1 Jan, year−2 → 31 Dec, current year) where the cumulative awarded value exceeds €20,000 for services/goods, or €30,000 for works (CPV beginning with 45). Score: 50 · Severity: High."
        a1_how: "CCP Art. 113 §2 sets statutory aggregate caps beyond which direct award to a single supplier is prohibited — not merely inadvisable. OECD (2023, LEGAL/0396) identifies repeat direct awarding to the same vendor as the principal mechanism used to circumvent competitive tendering in sub-threshold contracting, particularly prevalent in smaller public bodies."
        a2_title: "Publication after celebration"
        a2_desc: "Contract published to BASE more than 10 days after the signing date"
        a2_detail: "Trigger: publication date in BASE is more than 10 days after the celebration (signing) date. Score: 40 · Severity: Medium."
        a2_how: "CCP Art. 127 requires publication within 2 months of signing; the 10-day threshold marks the outer bound of ordinary administrative processing. Systematic late publication reduces public auditability and correlates with opacity in other procurement indicators (OECD, 2025)."
        a3_title: "Execution before publication"
        a3_desc: "Execution starts before the contract is published"
        a4_title: "Amendment inflation"
        a4_desc: "Large or frequent contract modifications inflating the original value"
        a5_title: "Threshold splitting"
        a5_desc: "Contract value falls within 5% below a procedural threshold (€5K / €20K / €75K / €150K / €5.35M). Score: 35 · Severity: Medium."
        a5_detail: "Trigger: base_price falls in the window [threshold × 0.95, threshold) for any of five CCP procedural thresholds — €5 000, €20 000, €75 000, €150 000, €5 350 000. All five are checked independently; a contract within 5% below any threshold is flagged. Score: 35 · Severity: Medium."
        a5_how: "Each threshold marks a legal boundary above which a higher-scrutiny procedure (open tender or restricted procedure) becomes mandatory. Pricing a contract just below a boundary to remain within the simpler direct-award regime — bid splitting — is a standard circumvention technique specifically targeted by OECD anti-collusion guidelines (LEGAL/0396). A 5% window captures cases where the price was visibly engineered to avoid triggering the threshold."
        a6_title: "Single bidder"
        a6_desc: "Only one bidder participated in a competitive procedure"
        a7_title: "Abnormal direct-award rate"
        a7_desc: "Authority's direct-award rate ≥80% AND ≥25 percentage points above the CPV-division peer median, with at least 10 contracts. Score: 35 · Severity: Medium."
        a7_detail: "Trigger: procedure_type LIKE '%ajuste%' (case-insensitive). Authorities are grouped by CPV division (first 2 digits of cpv_code); only groups with ≥10 contracts are considered. The per-division peer median rate is computed using a two-row window function: AVG(rate) WHERE row_number IN ((N+1)/2, (N+2)/2). A flag is raised when the authority's direct-award rate is ≥80% AND exceeds the peer median by ≥25 percentage points. All direct-award contracts from flagged (authority, CPV division) pairs are flagged. Score: 35 · Severity: Medium."
        a7_how: "The dual threshold — absolute ≥80% and relative ≥25 pp above peers — prevents false positives in sectors where direct awards are legitimately frequent. CPV-division grouping ensures authorities are compared only against peers procuring similar goods or services. Systematic over-use of direct award is one of the primary mechanisms used to circumvent competitive tendering obligations under CCP Art. 19 (OECD, 2023)."
        a8_title: "Long execution"
        a8_desc: "Execution duration exceeds 3 years"
        a9_title: "Price anomaly"
        a9_desc: "Effective price exceeds base price by >50% (score 30) or >100% (score 55); or effective price is <50% of base (score 10, possible predatory bid or data error). Severity: Medium/High/Low."
        a9_detail: "Trigger: ratio = total_effective_price ÷ base_price. Requires base_price ≠ 0 and total_effective_price present. Three scoring tiers — ratio > 1.5: A9_PRICE_ANOMALY, medium, score 30; ratio ≥ 2.0: A9_PRICE_ANOMALY, high, score 55; ratio < 0.5: A9_PRICE_REDUCTION, low, score 10."
        a9_how: "Price overruns are a classic post-award manipulation vector: the base price is kept low to win the award, then inflated via scope changes or amendments that would have invalidated the bid competitively. A ratio ≥ 2.0 (more than double the estimate) is treated as high severity. A ratio below 0.5 suggests either a predatory below-cost bid designed to win and recoup via amendments, or a systematic data entry error — both warrant review."
        b1_title: "Bid rotation"
        b1_desc: "Suppliers rarely compete except with one authority (graph analysis)"
        b2_title: "Supplier concentration"
        b2_desc: "One supplier captures ≥70% of an authority's awarded value (min 5 contracts to the authority, 3 to the winner). Score: 45 · Severity: High."
        b2_detail: "Trigger: for each (authority, winner) pair, winner_contracts ÷ authority_total_contracts ≥ 0.70, where authority_total_contracts ≥ 5 and winner_contracts ≥ 3. Contracts are linked via the contract_winners join table. All contracts from flagged (authority, winner) pairs are flagged. Score: 45 · Severity: High."
        b2_how: "A concentration ratio of 70% or above indicates that competitive award is de facto absent — a single supplier dominates the authority's procurement budget. The minimum-count guards (≥5 total, ≥3 to winner) prevent small-N artefacts from triggering false positives. Supplier lock-in at this level correlates with reduced price competition, reciprocal arrangements, and capture dynamics identified in OECD procurement risk frameworks (2023)."
        b3_title: "Unusual pricing"
        b3_desc: "Contract base price is a statistical outlier within its CPV-division × year peer group (min 10 peers). |z| ≥ 2.5 → score 25 (medium); |z| ≥ 3.5 → score 45 (high)."
        b3_detail: "Trigger: peer group = contracts sharing the same CPV division (first 2 digits of cpv_code) and same publication year (STRFTIME('%Y', publication_date)). Groups with fewer than 10 peers are excluded. Population standard deviation is computed as √(E[X²] − E[X]²) — equivalent to the standard formula and computable without a native STDDEV function. z-score = (base_price − peer_mean) ÷ peer_stddev. |z| ≥ 2.5 → medium (score 25); |z| ≥ 3.5 → high (score 45). Two sub-flags record direction: B3_PRICE_HIGH (z > 0) and B3_PRICE_LOW (z < 0)."
        b3_how: "High positive z-scores may indicate price manipulation, over-scoping, or inflated estimates designed to allow budget diversion or kickbacks. High negative z-scores may indicate a below-cost bid intended to win and recoup value through post-award amendments. Both directions carry independent risk. Peer grouping by CPV division × publication year controls for sector-specific price levels and inter-year inflation."
        b4_title: "Procedural shift"
        b4_desc: "Sudden change in procedure type distribution near budget deadlines"
        b5_title: "Benford's Law deviation"
        b5_desc: "Entity's contract values deviate from the Benford leading-digit distribution (chi-square goodness-of-fit, min 20 contracts). Score: 35 (p<0.05) or 55 (p<0.01)."
        b5_detail: "Benford's Law states that in naturally-occurring datasets the digit '1' leads about 30% of values, '2' about 18%, and so on — a logarithmic distribution. Contract values that have been fabricated, rounded to circumvent thresholds, or systematically split tend to produce a flat or irregular digit distribution instead."
        b5_how: "Applied at entity level: all base prices attributed to an entity are pooled. A chi-square goodness-of-fit test against the Benford distribution is run on leading digits. χ² > 15.507 (p<0.05) scores 35; χ² > 20.090 (p<0.01) scores 55. Entities with fewer than 20 contracts are excluded to avoid spurious results on small populations."
        c1_title: "Missing supplier NIF"
        c1_desc: "Supplier tax identifier absent or invalid, OR contract awarded (effective_price > 0) with no supplier identified. Score: 25 · Severity: Medium."
        c2_title: "Impossible date sequence"
        c2_desc: "Date fields out of order or outside plausible ranges"
        c3_title: "Missing mandatory fields"
        c3_desc: "CPV code, procedure type, or base price absent for the procedure type, or base price exceeds ±€1 trillion (implausible data entry). Score: 20 · Severity: Low."
        c4_title: "AdC sanction overlap"
        c4_desc: "Supplier NIF matches a Competition Authority cartel case"
        c5_title: "Entity name variation"
        c5_desc: "Same NIF appears under multiple name variants — potential obfuscation"
        c7_title: "Potential conflict of interest"
        c7_desc: "High-confidence shared individual link between a public-body officeholder and a supplier director/officer/shareholder. Score: 65 · Severity: High."

