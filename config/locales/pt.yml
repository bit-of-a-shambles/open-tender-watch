  privacy:
    title: "Política de Privacidade"
    last_updated: "Última atualização: abril de 2025"
    controller_heading: "Responsável pelo Tratamento"
    controller_text: "O Open Tender Watch é um projeto de transparência cívica open-source. Para questões de proteção de dados, contacte-nos através do repositório GitHub do projeto."
    purpose_heading: "Finalidade e Âmbito"
    purpose_text: "Esta plataforma processa dados de contratação pública disponíveis publicamente de bases de dados portuguesas e europeias (Portal BASE, SNS, TED) para detetar padrões de risco de corrupção. Os dados pessoais processados limitam-se a nomes e números de identificação fiscal (NIFs) de diretores e administradores de empresas, obtidos do Registo Comercial (publicacoes.mj.pt) — um registo público."
    legal_basis_heading: "Base Jurídica"
    legal_basis_text_html: "O tratamento baseia-se no <strong>Artigo 6(1)(e) do RGPD</strong> — missão de interesse público (monitorização anticorrupção e investigação jornalística) e <strong>Artigo 6(1)(f)</strong> — interesse legítimo na responsabilização pública de entidades que recebem fundos públicos. Foi realizada uma Avaliação de Interesse Legítimo (LIA). A <em>Lei n.° 58/2019</em> (implementação do RGPD) e a <em>Lei n.° 26/2016</em> (acesso à informação pública) suportam igualmente este tratamento."
    data_heading: "Dados Processados"
    data_text: "Metadados contratuais (objeto, preço, datas, tipo de procedimento, códigos CPV), identificadores de entidades (NIF/NIPC, nomes) e nomes e cargos de diretores/administradores obtidos de registos comerciais públicos. Não são processadas categorias especiais de dados (Art. 9 RGPD)."
    pseudonymisation_heading: "Pseudonimização"
    pseudonymisation_text: "Nomes de diretores e administradores são pseudonimizados por defeito para visitantes públicos. Apenas jornalistas e auditores autenticados com um token de acesso válido podem ver dados pessoais completos. Os identificadores pseudonimizados são determinísticos (a mesma pessoa mapeia sempre para o mesmo código) mas não podem ser revertidos sem acesso ao segredo da aplicação."
    graph_heading: "Visualizações em Grafo"
    graph_text: "Os grafos de rede são fornecidos para triagem de risco de corrupção e não para acusação. O modo público mostra apenas ligações entre entidades. Utilizadores autenticados podem ativar nós de indivíduos anonimizados obtidos de registos públicos; estes dados continuam pseudonimizados e não devem ser usados para tentativas de reidentificação."
    rights_heading: "Os Seus Direitos"
    rights_text_html: "Nos termos dos Artigos 15–22 do RGPD, os titulares dos dados têm direito de acesso, retificação, apagamento, limitação e oposição. Para exercer estes direitos, contacte-nos através do repositório GitHub do projeto. Note que o <strong>direito ao apagamento pode ser limitado</strong> ao abrigo do Artigo 17(3)(a) (liberdade de expressão e informação) e Artigo 17(3)(d) (arquivo de interesse público). Responderemos no prazo de 30 dias."
    retention_heading: "Retenção"
    retention_text: "Os dados pessoais são retidos enquanto os registos públicos subjacentes permanecerem disponíveis publicamente. Os registos de utilização de tokens de acesso são retidos durante 12 meses."
    contact_heading: "Contacto"
    contact_text: "Para questões de proteção de dados, submeta uma issue no repositório GitHub do projeto: github.com/bit-of-a-shambles/open-tender-watch"
