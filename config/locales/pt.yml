    methodology:
      heading: "Metodologia"
      subheading: "Como são determinados os scores de risco e o que significa cada indicador"
      approach_label: "ABORDAGEM"
      track_a: "PISTA A — INDICADORES BASEADOS EM REGRAS"
      track_b: "PISTA B — INDICADORES ESTATÍSTICOS"
      track_c: "PISTA C — INTEGRIDADE E CONFORMIDADE"
      primary_refs: "REFERÊNCIAS PRIMÁRIAS"
      approach_p1: "Os indicadores de risco seguem o enquadramento da OCDE para deteção de corrupção e conluio na contratação pública. Cada indicador é pontuado de forma independente e tem um nível de confiança associado — o score degrada quando campos essenciais (NIF, CPV, preço, datas) estão em falta."
      approach_p2: "O sistema destaca casos para auditoria e investigação jornalística. Não produz conclusões. Todos os resultados devem ser tratados como pistas, não como achados."
      track_b_note: "B2, B3, B5 ativos. B1, B4 em desenvolvimento — necessitam de volume de dados mínimo de 2 anos."
      disclaimer: "Os scores de risco refletem anomalias estruturais nos dados de contratação. Dados em falta ou inconsistentes são, por si só, um sinal de risco — podem indicar evasão. A ausência de um indicador não significa que o contrato seja irregular."
      contracts_affected:
        one: "%{count} contrato afetado"
        other: "%{count} contratos afetados"
      risk_scoring:
        heading: "ALGORITMO DE PONTUAÇÃO DE RISCO"
        intro: "As pontuações dos indicadores acumulam-se por contrato. Os totais da entidade e da empresa (todos os contratos adjudicados ou ganhos) determinam o seu nível de risco agregado:"
        tier_none: "SEM RISCO"
        tier_low: "RISCO BAIXO"
        tier_medium: "RISCO MÉDIO"
        tier_high: "RISCO ALTO"
        tier_critical: "RISCO CRÍTICO"
        range_none: "0 pontos"
        range_low: "1–34 pontos"
        range_medium: "35–69 pontos"
        range_high: "70–109 pontos"
        range_critical: "≥ 110 pontos"
        degradation: "As pontuações são reduzidas proporcionalmente quando campos de dados obrigatórios (NIF, CPV, preço, datas) estão ausentes ou inválidos no registo do contrato."
      flags:
        a1_title: "Ajuste direto repetido"
        a1_desc: "O mesmo fornecedor recebe ≥2 ajustes diretos em 36 meses com valor acumulado acima do limite estatutário do Art. 113 §2 do CCP"
        a1_detail: "Gatilho: ≥2 ajustes diretos ao mesmo fornecedor dentro da janela económica trienal corrente (1 jan, ano−2 → 31 dez, ano corrente), em que o valor adjudicado acumulado ultrapassa €20.000 para serviços/bens, ou €30.000 para empreitadas de obras (CPV com início em 45). Score: 50 · Gravidade: Alta."
        a1_how: "O Art. 113 §2 do CCP estabelece limites agregados estatutários acima dos quais o ajuste direto a um único fornecedor é proibido — e não apenas desaconselhado. A OCDE (2023, LEGAL/0396) identifica a adjudicação direta repetida ao mesmo fornecedor como o principal mecanismo de contorno ao concurso público na contratação abaixo dos limiares, particularmente prevalente em entidades adjudicantes de menor dimensão."
        a2_title: "Publicação posterior à celebração"
        a2_desc: "Contrato publicado no BASE mais de 10 dias após a data de celebração"
        a2_detail: "Gatilho: data de publicação no BASE superior a 10 dias após a data de celebração (assinatura) do contrato. Score: 40 · Gravidade: Média."
        a2_how: "O Art. 127 do CCP exige a publicação no BASE no prazo de 2 meses após a celebração; o limiar de 10 dias marca o limite exterior do processamento administrativo ordinário. A publicação sistematicamente tardia reduz a auditabilidade pública e correlaciona-se com opacidade noutros indicadores de contratação (OCDE, 2025)."
        a3_title: "Execução antes da publicação"
        a3_desc: "A execução começa antes de o contrato ser publicado"
        a4_title: "Inflação por modificação"
        a4_desc: "Modificações contratuais grandes ou frequentes que inflacionam o valor original"
        a5_title: "Fracionamento de limiares"
        a5_desc: "Valor do contrato dentro de 5% abaixo de um limiar procedimental (€5K / €20K / €75K / €150K / €5,35M). Score: 35 · Gravidade: Média."
        a6_title: "Concorrente único"
        a6_desc: "Apenas um concorrente participou num procedimento competitivo"
        a7_title: "Taxa anormal de ajuste direto"
        a7_desc: "Taxa de ajuste direto da entidade ≥80% E ≥25 pontos percentuais acima da mediana dos pares na mesma divisão CPV, com pelo menos 10 contratos. Score: 35 · Gravidade: Média."
        a8_title: "Execução prolongada"
        a8_desc: "Duração de execução superior a 3 anos"
        a9_title: "Anomalia de preço"
        a9_desc: "Preço efetivo superior ao preço base em >50% (score 30) ou >100% (score 55); ou preço efetivo <50% do base (score 10, possível proposta predatória ou erro de dados). Gravidade: Média/Alta/Baixa."
        b1_title: "Rotação de propostas"
        b1_desc: "Fornecedores raramente concorrem exceto com uma entidade (análise de grafo)"
        b2_title: "Concentração de fornecedores"
        b2_desc: "Um fornecedor concentra ≥70% do valor adjudicado por uma entidade (mín. 5 contratos à entidade, 3 ao vencedor). Score: 45 · Gravidade: Alta."
        b3_title: "Preço invulgar"
        b3_desc: "Preço base do contrato é um valor atípico no grupo de pares divisão CPV × ano (mín. 10 pares). |z| ≥ 2,5 → score 25 (médio); |z| ≥ 3,5 → score 45 (alto)."
        b4_title: "Mudança procedimental"
        b4_desc: "Alteração súbita na distribuição de tipos de procedimento próximo de prazos orçamentais"
        b5_title: "Desvio da Lei de Benford"
        b5_desc: "Valores contratuais da entidade desviam-se da distribuição de Benford por algarismo inicial (qui-quadrado, mín. 20 contratos). Score: 35 (p<0,05) ou 55 (p<0,01)."
        b5_detail: "A Lei de Benford estabelece que em conjuntos de dados naturais o dígito '1' lidera cerca de 30% dos valores, '2' cerca de 18%, e assim sucessivamente — uma distribuição logarítmica. Valores contratuais fabricados, arredondados para contornar limiares ou sistematicamente fracionados tendem a produzir uma distribuição de dígitos plana ou irregular."
        b5_how: "Aplicado ao nível da entidade: todos os preços base atribuídos a uma entidade são agrupados. Um teste qui-quadrado de ajustamento à distribuição de Benford é efetuado sobre os algarismos iniciais. χ² > 15,507 (p<0,05) pontua 35; χ² > 20,090 (p<0,01) pontua 55. Entidades com menos de 20 contratos são excluídas para evitar resultados espúrios em populações pequenas."
        c1_title: "NIF do fornecedor em falta"
        c1_desc: "Identificador fiscal ausente ou inválido, OU contrato adjudicado (preço efetivo > 0) sem fornecedor identificado. Score: 25 · Gravidade: Média."
        c2_title: "Sequência de datas impossível"
        c2_desc: "Campos de data fora de ordem ou de intervalos plausíveis"
        c3_title: "Campos obrigatórios em falta"
        c3_desc: "Código CPV, tipo de procedimento ou preço base ausentes para o tipo de procedimento, ou preço base superior a ±€1 bilião (introdução de dados implausível). Score: 20 · Gravidade: Baixa."
        c4_title: "Sobreposição com sanções AdC"
        c4_desc: "NIF do fornecedor corresponde a um caso de cartel da Autoridade da Concorrência"
        c5_title: "Variação do nome da entidade"
        c5_desc: "O mesmo NIF aparece com múltiplas variantes de nome — potencial dissimulação"

